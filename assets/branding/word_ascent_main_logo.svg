<svg xmlns="http://www.w3.org/2000/svg" width="128" height="104" viewBox="0 0 128 104">
  <!-- Small summit flag, kept behind the original top block. -->
  <path d="M64 28V2.5" fill="none" stroke="#1a0a5e" stroke-width="2" stroke-linecap="round"/>
  <path d="M65 4.8L81.5 8.7L65 12.8Z" fill="#ffd600" stroke="#1a0a5e" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Compact hard shadows echo the new store icon without making the mark busy. -->
  <g fill="#1a0a5e" opacity="0.30">
    <rect x="55" y="29" width="24" height="15" rx="4"/>
    <rect x="41" y="48" width="24" height="15" rx="4"/>
    <rect x="69" y="48" width="24" height="15" rx="4"/>
    <rect x="27" y="67" width="24" height="15" rx="4"/>
    <rect x="55" y="67" width="24" height="15" rx="4"/>
    <rect x="83" y="67" width="24" height="15" rx="4"/>
    <rect x="13" y="86" width="24" height="15" rx="4"/>
    <rect x="41" y="86" width="24" height="15" rx="4"/>
    <rect x="69" y="86" width="24" height="15" rx="4"/>
    <rect x="97" y="86" width="24" height="15" rx="4"/>
  </g>

  <!-- Navy outlines connect the in-game mark to the new app icon. -->
  <g stroke="#1a0a5e" stroke-width="1.6">
    <rect x="52" y="25" width="24" height="15" rx="4" fill="#b939ff"/>
    <rect x="38" y="44" width="24" height="15" rx="4" fill="#ff5533"/>
    <rect x="66" y="44" width="24" height="15" rx="4" fill="#ff5533"/>
    <rect x="24" y="63" width="24" height="15" rx="4" fill="#00bfa5"/>
    <rect x="52" y="63" width="24" height="15" rx="4" fill="#00bfa5"/>
    <rect x="80" y="63" width="24" height="15" rx="4" fill="#00bfa5"/>
    <rect x="10" y="82" width="24" height="15" rx="4" fill="#ffd600"/>
    <rect x="38" y="82" width="24" height="15" rx="4" fill="#ffd600"/>
    <rect x="66" y="82" width="24" height="15" rx="4" fill="#ffd600"/>
    <rect x="94" y="82" width="24" height="15" rx="4" fill="#ffd600"/>
  </g>

  <!-- Small top-edge highlights add depth while preserving the flat UI language. -->
  <g fill="#ffffff" opacity="0.24">
    <rect x="55" y="27" width="18" height="2" rx="1"/>
    <rect x="41" y="46" width="18" height="2" rx="1"/>
    <rect x="69" y="46" width="18" height="2" rx="1"/>
    <rect x="27" y="65" width="18" height="2" rx="1"/>
    <rect x="55" y="65" width="18" height="2" rx="1"/>
    <rect x="83" y="65" width="18" height="2" rx="1"/>
    <rect x="13" y="84" width="18" height="2" rx="1"/>
    <rect x="41" y="84" width="18" height="2" rx="1"/>
    <rect x="69" y="84" width="18" height="2" rx="1"/>
    <rect x="97" y="84" width="18" height="2" rx="1"/>
  </g>

  <!-- Snow caps the summit from above and drapes unevenly over its front edge. -->
  <path d="M51.2 28.1
           L51.2 25.8
           C53.5 25.1 54.7 22.4 57.7 22.7
           C60.3 23 61.7 20.9 64.3 21.3
           C67.2 21.7 68.5 23.6 70.9 22.8
           C73.4 22 75.7 23.8 76.8 25.8
           L76.8 29.3
           C74.4 30 73 28.4 70.8 29
           C68.3 29.7 67.8 32 65.4 32
           C62.7 32 61.7 29 59.3 29.6
           C56.6 30.2 54.4 30.8 51.2 29.5Z"
        fill="#fffdf5" stroke="#d6cfef" stroke-width="0.8" stroke-linejoin="round"/>
</svg>
